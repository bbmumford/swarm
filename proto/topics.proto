//
// Typed record bodies for distributed-state swarm topics. Each message
// is carried in the body of a swarm.Record on its named topic.

syntax = "proto3";

package swarm.v1;

option go_package = "github.com/bbmumford/swarm/proto/pb";

// ---------- Distribution manifest topics ----------
//
// Each "manifest" carries the SHA256 hash + metadata of an artifact whose
// bytes are fetched via ContentTopic.

// PolicyManifest lives on `agent.policy.<partition>` (replaces the existing
// `policy:` prefix gossip with manifest semantics).
message PolicyManifest {
  uint64 epoch = 1;
  bytes  bundleHash = 2;    // SHA256 of the PolicyBundle bytes
  string etag = 3;          // ETag for C2 fallback fetch
  uint32 bundleSize = 4;    // bytes
  bytes  publisher = 5;     // NodeID who published this (typically Edge)
  int64  publishedAt = 6;
  bytes  sig = 7;           // Ed25519 by publisher
}

// TrustManifest lives on `agent.trust.<partition>` (replaces `trust:` prefix).
// Carries the RD epoch — the actual key material rides KeyRotationEnvelope.
message TrustManifest {
  uint64 rdEpoch = 1;
  bytes  rdHash = 2;        // SHA256 of the Root Descriptor bytes
  bytes  publisher = 3;
  int64  publishedAt = 4;
  bytes  sig = 5;
}

// KeyRotationEnvelope is published when a region root (RR) or a partition
// root (PR) rotates, or when the partition's network key does. Lives on
// `agent.keys.<partition>`. For a root, the body of the corresponding
// ContentTopic fetch contains the actual signed certificate. For a network
// key, the envelope carries the old and new key fingerprints only: members
// collect the key itself through PollEnrollment, never from the topic.
message KeyRotationEnvelope {
  enum KeyKind {
    KEY_UNKNOWN = 0;
    KEY_REGION_ROOT = 1;     // RR rotation
    KEY_PARTITION_ROOT = 2;  // PR rotation
    KEY_NETWORK = 3;         // the partition's network key (Noise PSK) rotation
  }
  KeyKind kind = 1;
  bytes   oldFingerprint = 2;
  bytes   newFingerprint = 3;
  bytes   newKeyHash = 4;         // hash of the new key+cert blob (ContentTopic); empty for KEY_NETWORK
  uint64  gracePeriodS = 5;       // seconds; 0 = immediate (compromise)
  bytes   signedBy = 6;           // pubkey that signed (RR for a PR rotation; OR for an RR rotation; the partition's active PR for KEY_NETWORK)
  bytes   signature = 7;          // signature over the above
}

// BlocklistManifest lives on `agent.blocklists.<partition>`. Edge Endpoint
// downloads blocklist from URL, hashes, publishes; other agents FetchBlob.
message BlocklistManifest {
  string listId = 1;
  bytes  blocklistHash = 2;  // SHA256 of blocklist content
  string sourceUrl = 3;      // for C2/URL fallback
  uint32 refreshIntervalS = 4;
  uint32 size = 5;
  bytes  publisher = 6;
  int64  publishedAt = 7;
  bytes  sig = 8;
}

// AssetManifest lives on `agent.assets.<partition>`. Admin uploads via
// app.orbtr.io → C2 signs this → agents scope-match + FetchBlob.
message AssetManifest {
  string assetId = 1;
  bytes  contentHash = 2;     // SHA256
  uint64 size = 3;
  ScopeSpec scope = 4;        // who should fetch
  string filename = 5;
  string mime = 6;
  int64  uploadedAt = 7;
  bytes  uploadedByUser = 8;   // SHA256(admin_email) for audit
  bytes  signedBy = 9;         // partition root (PR) pubkey
  bytes  signature = 10;
}

// ScopeSpec is a target expression for asset distribution.
message ScopeSpec {
  // One-of: tagExpression OR device_group OR deviceIds.
  // If multiple set, intersection applies.
  string tagExpression = 1;        // e.g. "env=prod AND role=critical"
  repeated string deviceGroups = 2;
  repeated string deviceIds = 3;
}

// RuleManifest lives on `agent.rules.<partition>.<type>` where type is
// yara|capa|sigma|flirt.
message RuleManifest {
  string ruleType = 1;      // "yara" | "capa" | "sigma" | "flirt"
  string ruleId = 2;
  bytes  packHash = 3;      // SHA256 of rule pack
  uint64 version = 4;
  uint32 size = 5;
  bytes  publisher = 6;
  int64  publishedAt = 7;
  bytes  sig = 8;
}

// DriverManifest lives on `agent.drivers.<partition>.<platform>`. Edge
// Endpoint extracts printer drivers, hashes, publishes.
message DriverManifest {
  string printerModel = 1;
  string platform = 2;      // "windows" | "macos" | "linux"
  bytes  driverHash = 3;
  uint32 size = 4;
  bytes  publisher = 5;     // Edge that extracted
  int64  publishedAt = 6;
  bytes  sig = 7;
}

// VoucherManifest lives on `agent.vouchers.<partition>` (offline enrollment).
message VoucherManifest {
  string voucherId = 1;
  bytes  voucherHash = 2;
  bytes  deviceFingerprint = 3;  // for whom this voucher applies
  int64  expiresAt = 4;
  bytes  signedBy = 5;           // partition root (PR) pubkey
  bytes  signature = 6;
}

// TUFManifest lives on `agent.tuf-meta.<channel>` (channel = stable|beta|canary).
// Carries TUF root.json / targets.json metadata hashes.
message TUFManifest {
  string artifactKind = 1;  // "agent" | "tools" | "tray" | "root.json" | "targets.json"
  string version = 2;
  bytes  metadataHash = 3;  // hash of the TUF metadata document
  bytes  binaryHash = 4;   // hash of the binary (when artifactKind ∈ agent/tools/tray)
  uint64 size = 5;
  int64  publishedAt = 6;
  bytes  sig = 7;           // region-root (RR) signed
}

// FIMBaselineManifest lives on `agent.fim-baselines.<partition>.<path-hash>`.
message FIMBaselineManifest {
  bytes  pathHash = 1;      // SHA256 of monitored path
  bytes  baselineHash = 2;  // SHA256 of baseline snapshot
  uint32 size = 3;
  bytes  publisher = 4;
  int64  publishedAt = 5;
  bytes  sig = 6;
}

// OSQueryPackManifest (for when OSquery support lands).
message OSQueryPackManifest {
  string packName = 1;
  string version = 2;
  bytes  packHash = 3;
  bytes  publisher = 4;
  int64  publishedAt = 5;
  bytes  sig = 6;
}

// LiveQueryResultManifest (opt-in) lives on `agent.livequery-cache.<partition>`.
message LiveQueryResultManifest {
  bytes  queryHash = 1;       // SHA256(SELECT statement + scope filters)
  bytes  resultHash = 2;      // SHA256 of result bytes
  uint32 resultSize = 3;
  int64  computedAt = 4;
  uint32 timeBucketS = 5;   // (computedAt / timeBucketS) is the cache key
  bytes  publisher = 6;       // who ran the query
  bytes  sig = 7;
}

// ForensicIndex lives on `agent.forensic-index.<partition>`. Carries ONLY
// hashes of forensic artifacts; bytes stay local (privacy).
message ForensicIndex {
  string artifactType = 1;  // "crash_dump" | "log_excerpt" | "memory_image" | ...
  bytes  artifactHash = 2;
  uint32 size = 3;
  bytes  collectedBy = 4;   // NodeID
  int64  collectedAt = 5;
  bytes  sig = 6;
}

// ---------- Operational state topics ----------

// DDNSRecord lives on `agent.ddns.<partition>`. Carries Hidden + Admin zone
// records with health-check + failover semantics.
message DDNSRecord {
  enum Zone {
    ZONE_UNKNOWN = 0;
    ZONE_HIDDEN = 1;   // {role}.{partition_id}.ddns.orbtr.io
    ZONE_ADMIN = 2;    // {custom}.{partition_id}.ddns.orbtr.io
  }
  enum FailoverMode {
    FAILOVER_ACTIVE_ACTIVE = 0;
    FAILOVER_ACTIVE_PASSIVE = 1;
    FAILOVER_GEO_PROXIMITY = 2;
  }

  string name = 1;          // e.g. "anchor", "edge-svc-1"
  Zone   zone = 2;
  repeated DNSEntry records = 3;
  HealthCheckSpec healthCheck = 4;
  FailoverMode failover = 5;
  uint32 ttl = 6;
  bytes  publisher = 7;
  int64  publishedAt = 8;
  bytes  sig = 9;
}

message DNSEntry {
  string type = 1;   // "A" | "AAAA" | "CNAME"
  string value = 2;
  bool   healthy = 3; // last known health probe result
  uint32 weight = 4;  // for weighted load balancing
  uint32 priority = 5; // for active-passive
}

message HealthCheckSpec {
  string protocol = 1;     // "https" | "tcp" | "icmp"
  uint32 port = 2;
  string path = 3;          // for https
  uint32 intervalS = 4;
  uint32 timeoutS = 5;
  uint32 unhealthyThreshold = 6;
}

// QuarantineNotice lives on `agent.quarantine.<partition>`.
message QuarantineNotice {
  bytes  peerNodeId = 1;
  string reason = 2;
  int64  effectiveAt = 3;
  int64  expiresAt = 4;  // 0 = until cleared
  bool   cleared = 5;
  bytes  signedBy = 6;
  bytes  signature = 7;
}

// DHCPLeaseRecord lives on `agent.dhcp.<partition>.<segment>`.
message DHCPLeaseRecord {
  string macAddress = 1;
  string ipAddress = 2;
  string segment = 3;
  string hostname = 4;
  int64  leasedAt = 5;
  int64  expiresAt = 6;
  bytes  issuingNode = 7;  // Edge that issued the lease
  bytes  sig = 8;
}

// DiscoveredAsset lives on `agent.discovered-assets.<partition>`.
message DiscoveredAsset {
  string assetType = 1;        // "printer" | "snmp_device" | "ups" | ...
  string macAddress = 2;        // primary dedup key
  string ipAddress = 3;
  string vendor = 4;
  string model = 5;
  map<string, string> attributes = 6;
  bytes  discoveredBy = 7;
  int64  discoveredAt = 8;
  bytes  sig = 9;
}

// PrinterRecord lives on `agent.printers.<partition>` (dedup of discovered printers).
message PrinterRecord {
  string macAddress = 1;
  string model = 2;
  string location = 3;
  bool   networkPrinter = 4;
  bool   shared = 5;
  string status = 6;
  bytes  driverHash = 7;  // optional — points at DriverManifest
  bytes  observedBy = 8;
  int64  observedAt = 9;
  bytes  sig = 10;
}

// ServiceStateRecord lives on `agent.service-state.<partition>`.
message ServiceStateRecord {
  string serviceName = 1;
  string state = 2;       // "running" | "stopped" | "failed"
  string deviceId = 3;
  int64  changedAt = 4;
  bytes  observedBy = 5;
  bytes  sig = 6;
}

// InventoryDelta lives on `agent.inventory-deltas.<partition>`.
message InventoryDelta {
  string category = 1;          // "hardware" | "os" | "network" | "software" | ...
  bytes  deltaHash = 2;         // SHA256 of canonical delta payload
  bytes  deltaPayload = 3;      // small enough to inline; bigger goes to ContentTopic
  bytes  deltaPayloadHash = 4;   // if payload empty, fetch from ContentTopic by this hash
  bytes  observedBy = 5;
  int64  observedAt = 6;
  bytes  sig = 7;
}

// ---------- Security-critical topics ----------

// RevocationNotice lives on `agent.revoked-keys.<partition>`.
message RevocationNotice {
  bytes  revokedFingerprint = 1;
  string reason = 2;
  int64  effectiveAt = 3;
  bytes  signedBy = 4;  // typically OR
  bytes  signature = 5;
}

// NetworkPSKRotation lives on `agent.network-psk.<partition>.<epoch>`.
message NetworkPSKRotation {
  uint64 epoch = 1;
  bytes  newPskHash = 2;   // hash; new PSK fetched via ContentTopic
  uint64 gracePeriodS = 3;
  bytes  signedBy = 4;  // partition root (PR)
  bytes  signature = 5;
}

// TrustPinUpdate lives on `agent.trust-pins.<partition>`.
message TrustPinUpdate {
  enum PinKind {
    PIN_SPKI = 0;
    PIN_NODE_ID = 1;
  }
  PinKind kind = 1;
  bytes  pinHash = 2;
  string domain = 3;       // applies to TLS pins
  bool   add = 4;          // true = add, false = remove
  bytes  signedBy = 5;
  bytes  signature = 6;
}

// TLSPinTOFU lives on `agent.tls-pins.<partition>.<domain>`.
message TLSPinTOFU {
  string domain = 1;
  bytes  pinHash = 2;
  string source = 3;     // "policy" | "tofu"
  int64  observedAt = 4;
  bytes  observedBy = 5;
  bytes  sig = 6;
}

// IntegrityAlert lives on `agent.integrity-alert.<partition>`.
message IntegrityAlert {
  string violationType = 1;  // "db_tamper" | "binary_modified" | "config_modified" | ...
  string detail = 2;
  bytes  deviceId = 3;
  int64  detectedAt = 4;
  bytes  observedBy = 5;
  bytes  sig = 6;
}

// ---------- Multi-session / multi-device topics ----------

// SessionRecord lives on `agent.session.<partition>.<device>`.
message SessionRecord {
  string sessionId = 1;
  string osUserHash = 2;   // SHA256(user@domain)
  string deviceId = 3;
  string state = 4;          // "logged_in" | "logged_out"
  int64  changedAt = 5;
  bytes  observedBy = 6;
  bytes  sig = 7;
}

// ConsentRecord lives on `agent.consent.<partition>.<user_id>`.
message ConsentRecord {
  string userHash = 1;
  bytes  scriptHash = 2;  // what the user consented to (or denied)
  string decision = 3;      // "approved" | "denied"
  int64  decidedAt = 4;
  string deviceId = 5;      // which device the user decided on
  bytes  sig = 6;
}

// RemoteSessionRecord lives on `agent.remote-sessions.<partition>`.
message RemoteSessionRecord {
  string sessionId = 1;
  string sessionType = 2;  // "remote_desktop" | "remote_shell" | "tunnel_rdp" | "tunnel_ssh"
  bytes  adminEmailHash = 3;
  bytes  targetDeviceId = 4;
  int64  startedAt = 5;
  int64  expiresAt = 6;
  string status = 7;       // "active" | "terminated"
  bytes  sig = 8;
}

// TunnelEndpoint lives on `agent.tunnels.<partition>`.
message TunnelEndpoint {
  string sessionId = 1;
  string protocol = 2;     // "rdp" | "ssh" | "custom"
  string localAddr = 3;    // 127.0.0.1:NNNN
  bytes  capabilityHash = 4;
  bytes  hostingNode = 5;
  int64  openedAt = 6;
  int64  expiresAt = 7;
  bytes  sig = 8;
}

// ---------- Telemetry / observability topics ----------

// HealthSummary lives on `agent.health.<partition>`. Distinct from the
// repurposed `agent.mesh.Health` named RPC: this is gossip-style summary;
// the RPC is point-to-point query.
message HealthSummary {
  uint32 peerCount = 1;
  uint32 activeSessions = 2;
  uint32 rttP50Ms = 3;
  uint32 rttP95Ms = 4;
  uint32 churnRatePerMin = 5;
  uint32 dispatchErrorsPerMin = 6;
  bytes  reportedBy = 7;
  int64  reportedAt = 8;
  bytes  sig = 9;
}

// EventRecord lives on `agent.event.<partition>.<type>`.
message EventRecord {
  string eventType = 1;  // "policy_applied" | "service_restart" | ...
  string deviceId = 2;
  map<string, string> attrs = 3;
  int64  occurredAt = 4;
  bytes  observedBy = 5;
  bytes  sig = 6;
}

// ThreatSignal lives on `agent.threat-signal.<partition>`. Carries ONLY
// signed hashes/aggregates — raw ETW content stays local (privacy).
message ThreatSignal {
  string signalType = 1;         // "suspicious_process_to_network" | "file_hash_match" | ...
  bytes  processHash = 2;        // SHA256(process_name + commandline) — no PII
  bytes  destinationHash = 3;    // SHA256(dest_ip:port) — no PII
  bytes  fileHash = 4;           // for file-hash threat signals
  int64  observedAt = 5;
  bytes  observedBy = 6;
  bytes  sig = 7;
}

// ---------- Privacy-aware opt-ins ----------

// DNSCacheEntry lives on `agent.dns-cache.<partition>` (opt-in only).
message DNSCacheEntry {
  string qname = 1;
  string qtype = 2;
  bytes  answerHash = 3;  // SHA256 of answer bytes
  uint32 ttlS = 4;
  int64  resolvedAt = 5;
  bytes  resolvedBy = 6;
  bytes  sig = 7;
}
